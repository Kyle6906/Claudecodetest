<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#CC0000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AFL Sales">
  <meta name="description" content="Atlanta Fork Lifts Inc — Field Sales Tool">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
  <title>AFL Sales Tracker</title>
</head>
<body>

  <!-- Offline banner (slides down when no connection) -->
  <div id="offline-banner">⚠ You are offline — showing cached data</div>

  <!-- App header -->
  <header id="app-header">
    <div class="header-title">AFL Sales</div>
    <div class="header-right">
      <div id="fb-dot"></div>
      <button id="refresh-btn" aria-label="Refresh">↻</button>
    </div>
  </header>

  <!-- Main scrollable content area -->
  <main id="main-content">

    <!-- Home Dashboard -->
    <div id="tab-home" class="tab-panel active"></div>

    <!-- Fleet Search -->
    <div id="tab-fleet" class="tab-panel"></div>

    <!-- Contacts -->
    <div id="tab-contacts" class="tab-panel"></div>

    <!-- Tasks -->
    <div id="tab-tasks" class="tab-panel"></div>

    <!-- Daily Log -->
    <div id="tab-dailylog" class="tab-panel"></div>

    <!-- Quick Quote -->
    <div id="tab-quote" class="tab-panel"></div>

  </main>

  <!-- Bottom navigation -->
  <nav id="bottom-nav">
    <button class="nav-btn active" data-tab="home" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Home
    </button>
    <button class="nav-btn" data-tab="fleet" aria-label="Fleet Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="3" width="15" height="13" rx="1"/>
        <path d="M16 8h4l3 3v5h-7V8z"/>
        <circle cx="5.5" cy="18.5" r="2.5"/>
        <circle cx="18.5" cy="18.5" r="2.5"/>
      </svg>
      Fleet
    </button>
    <button class="nav-btn" data-tab="contacts" aria-label="Contacts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 00-3-3.87"/>
        <path d="M16 3.13a4 4 0 010 7.75"/>
      </svg>
      Contacts
    </button>
    <button class="nav-btn" data-tab="tasks" aria-label="Tasks" style="position:relative">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 11 12 14 22 4"/>
        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>
      Tasks
      <span id="tasks-badge" class="nav-badge" style="display:none">0</span>
    </button>
    <button class="nav-btn" data-tab="dailylog" aria-label="Daily Log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
        <rect x="9" y="3" width="6" height="4" rx="1"/>
        <path d="M9 12h6M9 16h4"/>
      </svg>
      Log
    </button>
    <button class="nav-btn" data-tab="quote" aria-label="Quick Quote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="18" x2="12" y2="12"/>
        <line x1="9" y1="15" x2="15" y2="15"/>
      </svg>
      Quote
    </button>
  </nav>

  <!-- Contact profile full-screen sheet -->
  <div id="contact-sheet">
    <div class="sheet-header">
      <button id="sheet-back" class="sheet-back" aria-label="Back">← Back</button>
      <div id="sheet-title" class="sheet-title"></div>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>

  <!-- Install prompt (Android / iOS) -->
  <div id="install-prompt">
    <div class="install-icon">🏭</div>
    <span id="install-text" class="install-text"><strong>Install AFL Sales</strong>Add to your home screen for quick access</span>
    <button id="install-btn" class="install-btn">Install</button>
    <button id="install-dismiss" class="install-dismiss" aria-label="Dismiss">✕</button>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
